# Cấu hình pre-commit (tuỳ chọn) — https://pre-commit.com
# Cài: pipx install pre-commit && pre-commit install
# Bootstrap: bộ hook tối thiểu, an toàn; mở rộng (gdformat, dotnet format) ở phase sau.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key
