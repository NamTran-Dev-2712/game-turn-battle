name: validate-config

# Gate merge: validate config data-driven theo JSON Schema + referential integrity (ADR-005).
# Phase 03: giữ JSON parse-check (cú pháp) + thêm hook gọi tools/config-validator theo ngữ nghĩa
# `--if-present` (no-op tới khi Phase 07 hiện thực validator thật → khi đó thành GATE bắt buộc).
on:
  push:
    branches: [main, dev]
    paths: ["config/**", "shared/config-schema/**", ".github/workflows/validate-config.yml"]
  pull_request:
    paths: ["config/**", "shared/config-schema/**", ".github/workflows/validate-config.yml"]

concurrency:
  group: validate-config-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: JSON parse check (bootstrap — cú pháp)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          fail=0
          for f in config/**/*.json shared/config-schema/**/*.json; do
            if ! python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f"; then
              echo "::error file=$f::JSON không hợp lệ"; fail=1
            fi
          done
          exit $fail

      # Hook validator (`--if-present`): gọi tools/config-validator nếu đã có entrypoint chạy được;
      # nếu chưa (trước Phase 07) → no-op giữ workflow xanh. Phase 07 chỉ cần thêm run.sh để bật GATE.
      - name: config-validator hook (--if-present, no-op tới Phase 07)
        shell: bash
        run: |
          set -euo pipefail
          runner="tools/config-validator/run.sh"
          if [ -x "$runner" ]; then
            echo "config-validator hiện diện — chạy GATE thật."
            "$runner" config shared/config-schema
          else
            echo "STATUS : SKIP (--if-present)"
            echo "REASON : tools/config-validator/run.sh chưa hiện thực"
            echo "OWNER  : Phase 07 — khi có run.sh, bước này tự động thành GATE bắt buộc"
          fi
