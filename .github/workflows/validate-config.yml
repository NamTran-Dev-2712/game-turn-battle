name: validate-config

# Gate merge BẮT BUỘC: validate config data-driven theo JSON Schema + referential integrity + schema_version
# (ADR-004/005). Phase 07: tools/config-validator (CLI .NET 9) là GATE thật — config sai KHÔNG vào runtime.
# Bước 1 giữ JSON parse-check (cú pháp, nhanh). Bước 2 chạy validator (schema + reference + version).
on:
  push:
    branches: [main, dev]
    paths:
      - "config/**"
      - "shared/config-schema/**"
      - "tools/config-validator/**"
      - "global.json"
      - ".github/workflows/validate-config.yml"
  pull_request:
    paths:
      - "config/**"
      - "shared/config-schema/**"
      - "tools/config-validator/**"
      - "global.json"
      - ".github/workflows/validate-config.yml"

concurrency:
  group: validate-config-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: JSON parse check (bootstrap — cú pháp)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          fail=0
          for f in config/**/*.json shared/config-schema/**/*.json; do
            if ! python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f"; then
              echo "::error file=$f::JSON không hợp lệ"; fail=1
            fi
          done
          exit $fail

      - name: Setup .NET (pin theo global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-config-validator-${{ runner.os }}-${{ hashFiles('tools/config-validator/Directory.Packages.props') }}
          restore-keys: |
            nuget-config-validator-${{ runner.os }}-

      # GATE BẮT BUỘC: chạy validator thật. run.sh phải là entrypoint chạy được (exec bit trong git).
      # Nếu thiếu/không chạy được → FAIL (không SKIP) vì gate đã bắt buộc từ Phase 07.
      - name: Validate config (schema + referential integrity + version)
        shell: bash
        run: |
          set -euo pipefail
          runner="tools/config-validator/run.sh"
          if [ ! -x "$runner" ]; then
            echo "::error file=$runner::run.sh thiếu hoặc không có quyền thực thi (cần exec bit trong git)."
            exit 1
          fi
          "$runner" config shared/config-schema
