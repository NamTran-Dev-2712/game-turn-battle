name: ci-server

# Build + test backend .NET khi có thay đổi ở server/ (docs/deployment/ci-cd-pipeline.md).
on:
  push:
    branches: [main, dev]
    paths: ["server/**", ".github/workflows/ci-server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/ci-server.yml"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore server/GameTeam.sln

      - name: Build (warnings-as-error)
        run: dotnet build server/GameTeam.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test server/GameTeam.sln --no-build --configuration Release --verbosity normal

      # TODO (phase Core Framework+): architecture test (NetArchTest) là job gate riêng,
      # golden vector combat (server) — so khớp với client (ADR-011). Xem ci-cd-pipeline.md §4.
