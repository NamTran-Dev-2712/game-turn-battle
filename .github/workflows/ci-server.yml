name: ci-server

# Cổng chất lượng CI cho backend .NET 9 (docs/deployment/ci-cd-pipeline.md §7).
# Job: build-test (build Release + test + coverage), architecture-test (NetArchTest gate) và
# golden-vector (Phase 26 — server sim == baseline; client half ở ci-client.yml) chạy song song;
# config-validate là con trỏ (gate thật ở validate-config.yml, Phase 07).
on:
  push:
    branches: [main, dev]
    paths:
      - "server/**"
      - "shared/**"
      - "server/Directory.Build.props"
      - "server/Directory.Packages.props"
      - ".github/workflows/ci-server.yml"
  pull_request:
    paths:
      - "server/**"
      - "shared/**"
      - "server/Directory.Build.props"
      - "server/Directory.Packages.props"
      - ".github/workflows/ci-server.yml"

# Huỷ run cũ khi có commit mới trên cùng ref (tiết kiệm runner).
concurrency:
  group: ci-server-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: chỉ cần đọc source (không push/registry ở phase này).
permissions:
  contents: read

jobs:
  # Build Release (warnings-as-error do server/Directory.Build.props bật) + test + coverage artifact.
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # SDK cố định theo global.json (9.0.306) — nguồn sự thật duy nhất về version.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Cache NuGet; key theo hash Directory.Packages.props (CPM, ADR-010) — chưa dùng lockfile.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('server/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore server/GameTeam.sln

      - name: Build (warnings-as-error)
        run: dotnet build server/GameTeam.sln --no-restore --configuration Release

      # OpenAPI single-source (Phase 05): build vừa sinh lại shared/contracts/openapi.json từ
      # GameTeam.Contracts. Nếu bản commit đã cũ (drift với code) → CI đỏ. Buộc regenerate + commit.
      - name: OpenAPI drift guard
        run: git diff --exit-code -- shared/contracts/openapi.json

      - name: Test (+ coverage)
        run: >-
          dotnet test server/GameTeam.sln --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          --verbosity normal

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-server
          path: ./coverage/**/*.cobertura.xml
          if-no-files-found: error

  # Cổng architecture tách riêng: NetArchTest (GameTeam.Application.Tests) — báo đỏ rõ ràng khi
  # vi phạm dependency rule Clean Architecture, ví dụ leak Domain→Infrastructure (ADR-003).
  architecture-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('server/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore server/GameTeam.sln

      - name: Architecture tests (NetArchTest)
        run: >-
          dotnet test server/tests/GameTeam.Application.Tests/GameTeam.Application.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~ArchitectureTests"
          --verbosity normal

  # ĐÃ CHUYỂN — Phase 07 (docs/roadmap/07-*.md) đã hiện thực GATE thật ở workflow riêng
  # `.github/workflows/validate-config.yml` (tools/config-validator: JSON Schema + referential
  # integrity + schema_version). Job này giữ lại như con trỏ, KHÔNG lặp lại gate ở ci-server.
  config-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pointer notice
        run: |
          echo "STATUS : MOVED (gate thật đã bật ở Phase 07)"
          echo "GATE   : config-validate → .github/workflows/validate-config.yml"
          echo "SCOPE  : JSON Schema + referential integrity + schema_version (tools/config-validator)"
          echo "OWNER  : Phase 07 — docs/roadmap/07-config-validator-tool.md"

  # GATE golden-vector (Phase 26 — ĐÃ BẬT): sim server .NET == baseline đã commit (nguồn chân lý,
  # ADR-011). Phía client chạy song song ở `.github/workflows/ci-client.yml` (gdUnit4 golden_vector_test)
  # — cả hai so CÙNG baseline `shared/combat-vectors/*` ⇒ server ≡ client ≡ baseline. Lệch (sim drift
  # hoặc sửa vector) ⇒ CI đỏ, chặn merge. Gate BLOCKING — KHÔNG continue-on-error / '|| true'.
  golden-vector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('server/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Baseline drift guard: regenerate 'expected' từ sim server rồi so BYTE với vector đã commit.
      # Fail ⇒ sim đổi mà baseline chưa regenerate CÓ CHỦ ĐÍCH (xem tools/combat-baseline/README.md).
      - name: Golden baseline check (server sim == committed baseline)
        run: bash tools/combat-baseline/run.sh check

      # Hợp đồng: sim server khớp TỪNG golden vector (event_log + result), tự khám phá mọi vector.
      - name: Server golden vector tests
        run: >-
          dotnet test server/tests/GameTeam.Domain.Tests/GameTeam.Domain.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~GoldenVector"
          --verbosity normal
