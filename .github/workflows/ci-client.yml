name: ci-client

# Build + test client Godot khi có thay đổi ở client/ (docs/deployment/ci-cd-pipeline.md).
# BOOTSTRAP SKELETON: các bước Godot headless (import/test/export) là TODO — cần ghim
# Godot 4.x + export templates trong CI runner. Job hiện chỉ kiểm tra cấu trúc project.
on:
  push:
    branches: [main, dev]
    paths: ["client/**", ".github/workflows/ci-client.yml"]
  pull_request:
    paths: ["client/**", ".github/workflows/ci-client.yml"]

env:
  GODOT_VERSION: "4.7"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra project.godot tồn tại
        run: test -f client/project.godot

